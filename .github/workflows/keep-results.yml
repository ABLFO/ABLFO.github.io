name: Keep raffle results
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: keep-results
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync.mjs
      - name: Save state.json if it changed
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "raffle-sync"
            git config user.email "raffle-sync@users.noreply.github.com"
            git add state.json
            git commit -m "Save latest raffle results"
            git push
          fi
